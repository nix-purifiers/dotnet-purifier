# SPDX-License-Identifier: MIT
#
# `nix flake check` on every machine the purifier targets, and the
# conformance checks of the purifier contract that need the network or a
# second build, each on the applicable machines.
name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  flake-check:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm, macos-15]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - name: Check all outputs in the Nix sandbox
        run: nix flake check -L --max-jobs 2 --option sandbox true
      - name: Retain native execution receipts
        run: python3 tests/ci-receipts.py "$RUNNER_TEMP/receipts"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-receipts-${{ matrix.runner }}
          path: ${{ runner.temp }}/receipts
          if-no-files-found: error

  # Relocking a fixture reproduces its lockfile byte for byte. The
  # real-world project is locked from its pinned source, into the lockfile
  # kept in this repository. The multi fixture is relocked without the
  # packages.lock.json of its App project, which the lock then writes as
  # NuGet resolves it.
  conformance-relock:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm, macos-15]
        fixture: [multi, sources, workloads, update, current, real-world/fluentvalidation]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - name: Relock ${{ matrix.fixture }}
        run: |
          lockfile="$GITHUB_WORKSPACE/tests/fixtures/${{ matrix.fixture }}/dotnet-purifier.lock.json"
          if [ "${{ matrix.fixture }}" = real-world/fluentvalidation ]; then
            lockfile="$GITHUB_WORKSPACE/tests/real-world/fluentvalidation/dotnet-purifier.lock.json"
            src="$(nix build --no-link --print-out-paths --impure --expr '
              (import (builtins.getFlake "path:'"$GITHUB_WORKSPACE"'").inputs.nixpkgs { }).fetchFromGitHub {
                owner = "FluentValidation";
                repo = "FluentValidation";
                rev = "f95dbd5c8166a10e38f7a8bca4d752abd641a453";
                hash = "sha256-HNc7HxW4gLvOVVSY6yo3+NEOjNsIojemcj1dZ/KZhUM=";
              }')"
            cp -r "$src" "$RUNNER_TEMP/project"
            chmod -R u+w "$RUNNER_TEMP/project"
            cd "$RUNNER_TEMP/project"
          else
            cd "tests/fixtures/${{ matrix.fixture }}"
          fi
          if [ "${{ matrix.fixture }}" = multi ]; then
            rm src/App/packages.lock.json
          fi
          if [ "${{ matrix.fixture }}" = current ]; then
            export DOTNET_PURIFIER_NIXPKGS="$GITHUB_WORKSPACE/tests/toolchains"
            DOTNET_PURIFIER_SYSTEM="$(nix eval --raw --impure --expr builtins.currentSystem)"
            export DOTNET_PURIFIER_SYSTEM
            export DOTNET_PURIFIER_DEFAULT_SDK=11
            export DOTNET_PURIFIER_NIX_LIB="$GITHUB_WORKSPACE/nix/lib"
            export DOTNET_PURIFIER_FLAKE="$GITHUB_WORKSPACE"
            python3 "$GITHUB_WORKSPACE/cli/dotnet_purifier.py" lock --force --lockfile "$lockfile"
          else
            nix run "$GITHUB_WORKSPACE#default" -- lock --force --lockfile "$lockfile"
          fi
      - name: The lockfile is unchanged
        run: git diff --exit-code -- tests
      # With --tool-lockfile, a lock into a directory that does not exist
      # yet starts from the packages.lock.json in the tree, writes it there,
      # and leaves the tree and the lockfile as they are.
      - name: Relock multi with NuGet's lockfiles kept outside the tree
        if: matrix.fixture == 'multi'
        working-directory: tests/fixtures/multi
        run: |
          nix run "$GITHUB_WORKSPACE#default" -- lock --force --tool-lockfile "$RUNNER_TEMP/nuget-locks"
          cmp "$RUNNER_TEMP/nuget-locks/src/App/packages.lock.json" src/App/packages.lock.json
          git diff --exit-code -- "$GITHUB_WORKSPACE/tests"

  # A rebuild of a fixture gives the same output.
  conformance-rebuild:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm, macos-15]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - run: |
          system="$(nix eval --raw --impure --expr builtins.currentSystem)"
          for check in multi-app multi-greeter sources-web; do
            nix build --no-link -L ".#checks.$system.$check"
            nix build --no-link --rebuild ".#checks.$system.$check"
          done

  # After a prefetch, the everyday loop of a fixture works with no network:
  # its build and its tests run in a network namespace of their own.
  conformance-offline:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - name: Prefetch
        working-directory: tests/fixtures/multi
        run: |
          nix build --out-link "$RUNNER_TEMP/cli" "$GITHUB_WORKSPACE#default"
          "$RUNNER_TEMP/cli/bin/dotnet-purifier" prefetch
      # The namespace has only a loopback interface, which `dotnet test`
      # needs to reach its test host.
      - name: Build and test with no network
        working-directory: tests/fixtures/multi
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          offline() {
            unshare --net --map-root-user -- sh -c 'ip link set lo up && exec "$@"' sh "$@"
          }
          offline "$RUNNER_TEMP/cli/bin/dotnet-purifier" dotnet build src/App
          offline "$RUNNER_TEMP/cli/bin/dotnet-purifier" dotnet test test/Greeter.Tests

  # `update` moves a fixture that pins an old version to the newest one,
  # and both lockfiles then match the project.
  conformance-update:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm, macos-15]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - working-directory: tests/fixtures/update
        run: |
          nix build --out-link "$RUNNER_TEMP/cli" "$GITHUB_WORKSPACE#default"
          cli="$RUNNER_TEMP/cli/bin/dotnet-purifier"
          "$cli" update
          if grep -q 'Version="12.0.3"' App/App.csproj; then
            echo "update retained Newtonsoft.Json 12.0.3" >&2
            exit 1
          fi
          cp dotnet-purifier.lock.json "$RUNNER_TEMP/updated.lock.json"
          "$cli" lock
          cmp dotnet-purifier.lock.json "$RUNNER_TEMP/updated.lock.json"
          "$cli" dotnet restore App --locked-mode
